name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    if: github.repository == 'Undin/repo-mirroring-test-main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew build
