name: Mirror

on:
  push:
    branches: [main]
    tags: ['*']

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    # The workflow file is mirrored too, so don't run it in the mirror repository
    if: github.repository == 'Undin/repo-mirroring-test-main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Don't leave GITHUB_TOKEN in git config, the mirror is pushed with the app token
          persist-credentials: false

      # Deploy keys can't push changes in `.github/workflows`, so push with a GitHub App token
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.MIRROR_APP_CLIENT_ID }}
          private-key: ${{ secrets.MIRROR_APP_PRIVATE_KEY }}
          repositories: repo-mirroring-test-mirror
          permission-contents: write
          permission-workflows: write

      - name: Push to mirror repository
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git remote add mirror "https://x-access-token:${TOKEN}@github.com/Undin/repo-mirroring-test-mirror.git"
          git push mirror refs/remotes/origin/main:refs/heads/main
          git push mirror --tags
