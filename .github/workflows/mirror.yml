name: Mirror

on:
  push:
    branches: [main]
    tags: ['*']

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    # The workflow file is mirrored too, so don't run it in the mirror repository
    if: github.repository == 'Undin/repo-mirroring-test-main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Otherwise checkout rewrites SSH remotes to HTTPS with GITHUB_TOKEN,
          # which can't push to another repository
          persist-credentials: false

      - name: Push to mirror repository
        env:
          SSH_KEY: ${{ secrets.MIRROR_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/mirror_key
          chmod 600 ~/.ssh/mirror_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/mirror_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git remote add mirror git@github.com:Undin/repo-mirroring-test-mirror.git

          echo "::group::Diagnostics"
          git --version
          git config --show-origin --list
          git remote -v
          git remote get-url --push mirror
          env | grep -E '^(GIT_|SSH_)' | grep -v SSH_KEY || true
          ls -la ~/.ssh
          $GIT_SSH_COMMAND -T git@github.com || true
          echo "::endgroup::"

          GIT_TRACE=1 GIT_SSH_COMMAND="$GIT_SSH_COMMAND -v" git push mirror refs/remotes/origin/main:refs/heads/main
          git push mirror --tags
